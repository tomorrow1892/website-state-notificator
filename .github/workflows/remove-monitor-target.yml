name: Remove Monitor Target

on:
  workflow_dispatch:
    inputs:
      id:
        description: '監視対象のID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Remove monitor target
        run: |
          python manage_monitor_config.py remove \
            --id "${{ github.event.inputs.id }}"

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitor_config.json monitor_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Remove monitor target: ${{ github.event.inputs.id }}"
            git push
          else
            echo "No changes to commit."
          fi
